<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWh 정산시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="css/style.css?v=202610291339">
</head>
<body>

<div id="loginGate" class="login-gate">
  <div class="login-card">
    <img src="assets/logo.jpg" alt="한화 신한 테라와트아워" class="login-logo">
    <div id="pwStep" class="row" style="flex-direction:column; align-items:stretch; gap:10px;">
      <input type="text" id="loginId" placeholder="아이디" autocomplete="username">
      <div class="pw-field">
        <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password">
        <button type="button" id="pwToggleBtn" class="pw-toggle" aria-label="비밀번호 표시">
          <svg id="pwIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <ellipse cx="7" cy="12" rx="5.5" ry="7" stroke="currentColor" stroke-width="1.6"/>
            <ellipse cx="15.5" cy="12" rx="5.5" ry="7" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="8.3" cy="12" r="2.6" fill="currentColor"/>
            <circle cx="14.2" cy="12" r="2.6" fill="currentColor"/>
          </svg>
          <svg id="pwIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none;">
            <ellipse cx="7" cy="12" rx="5.5" ry="7" fill="currentColor"/>
            <ellipse cx="15.5" cy="12" rx="5.5" ry="7" fill="currentColor"/>
            <circle cx="8.3" cy="12" r="2.6" fill="#fff"/>
            <circle cx="14.2" cy="12" r="2.6" fill="#fff"/>
          </svg>
        </button>
      </div>
      <button class="btn accent" id="loginBtn">로그인</button>
    </div>
    <div id="otpStep" class="row login-step" hidden>
      <div class="otp-field"><input type="text" id="otpCode" placeholder="인증번호 6자리" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><span id="otpTimer" class="otp-timer"></span></div>
      <button class="btn accent" id="otpBtn">확인</button>
      <div class="login-sub"><button type="button" class="link-btn" id="otpResend">재전송</button><button type="button" class="link-btn" id="stepBack">처음으로</button></div>
    </div>
    <div id="linkStep" class="row login-step" hidden>
      <button class="btn kakao-btn" id="kakaoLinkBtn"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.48 3 2 6.48 2 10.78c0 2.77 1.85 5.2 4.64 6.58l-.95 3.48c-.08.3.26.54.52.37l4.15-2.74c.54.06 1.09.1 1.64.1 5.52 0 10-3.48 10-7.79S17.52 3 12 3z"/></svg>카카오 연결 후 로그인</button>
      <div class="login-sub"><button type="button" class="link-btn" id="linkBack">처음으로</button></div>
    </div>
    <div class="row" style="flex-direction:column; align-items:stretch;">
      <span id="loginError" class="status bad" style="display:none;"></span>
    </div>
  </div>
</div>

<div id="appRoot" style="display:none;">

<header class="app">
  <div class="app-title">
    <button class="side-open" id="sideOpenBtn" aria-label="메뉴 열기"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <!-- E-PPA 태양 로고 -->
    <a class="brand-home" href="#dash" title="정산 대시보드"><svg class="brand-sun" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <g class="brand-rays">
        <line x1="17" y1="1.5" x2="17" y2="7.5" stroke="#da7756" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="17" y1="26.5" x2="17" y2="32.5" stroke="#da7756" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="1.5" y1="17" x2="7.5" y2="17" stroke="#da7756" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="26.5" y1="17" x2="32.5" y2="17" stroke="#da7756" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="5.7" y1="5.7" x2="9.9" y2="9.9" stroke="#da7756" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
        <line x1="24.1" y1="24.1" x2="28.3" y2="28.3" stroke="#da7756" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
        <line x1="28.3" y1="5.7" x2="24.1" y2="9.9" stroke="#da7756" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
        <line x1="9.9" y1="24.1" x2="5.7" y2="28.3" stroke="#da7756" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
      </g>
      <circle class="brand-core" cx="17" cy="17" r="6.5" fill="#da7756"/>
      <circle cx="17" cy="17" r="4" fill="#e8926e" opacity=".55"/>
    </svg>
    <h1>TWh 정산시스템</h1></a>
  </div>
  <div class="hdr-right">
    <span class="test-today" id="testToday" hidden></span>
    <label class="hdr-zoom" title="화면 배율 (100% = 화면 크기에 자동 맞춤)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5M8.5 11h5M11 8.5v5"/></svg><select id="zoomSel"><option value="80">80%</option><option value="90">90%</option><option value="100">100%</option><option value="110">110%</option><option value="120">120%</option></select></label>
    <span class="hdr-user" id="hdrUser"></span>
    <div class="bell-wrap">
      <button type="button" class="hdr-icon" id="bellBtn" aria-label="알림">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="bell-dot" id="bellDot" hidden></span>
      </button>
      <div class="bell-panel" id="bellPanel" hidden></div>
    </div>
    <button type="button" class="hdr-logout" id="logoutBtn">로그아웃</button>
  </div>
</header>

<div class="layout">
  <!-- 사이드 메뉴 (js/nav.js): data-page 를 누르면 해당 page 를 보여준다 -->
  <aside class="sidebar" id="sidebar">
    <div class="side-toggle">
      <button type="button" data-group="contract">계약관리</button>
      <button type="button" data-group="settle">정산관리</button>
    </div>

    <nav class="side-menu" data-group="contract">
      <div class="side-section"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>전기사용자</span></div>
      <a class="side-link sub" data-page="page-cust-perf">계약이행현황</a>
      <div class="side-section"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>발전사업자</span></div>
      <a class="side-link sub" data-page="page-gen-perf">계약이행현황</a>
    </nav>

    <nav class="side-menu" data-group="settle">
      <a class="side-link" data-page="page-dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>정산 대시보드</span></a>
      <div class="side-folder">
        <button type="button" class="side-folder-btn"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg><span>계약관리</span><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="side-sub">
          <a class="side-link sub" data-page="page-reg-cust">전기사용자</a>
          <a class="side-link sub" data-page="page-reg-plant">발전사업자</a>
          <a class="side-link sub" data-page="page-reg-group">그룹화</a>
        </div>
      </div>
      <div class="side-folder">
        <button type="button" class="side-folder-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5h4a1.75 1.75 0 0 1 0 3.5h-3a1.75 1.75 0 0 0 0 3.5h4"/></svg><span>정산</span><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="side-sub">
          <a class="side-link sub" data-page="page-settle-cust">전기사용자</a>
          <a class="side-link sub" data-page="page-settle-gen">발전사업자</a>
          <a class="side-link sub" data-page="page-rec">초과발전량 REC 관리</a>
          <a class="side-link sub" data-page="page-archive">정산서 보관함</a>
          <div class="side-folder nested">
            <button type="button" class="side-folder-btn sub"><span>정산요율관리</span><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
            <div class="side-sub">
              <a class="side-link sub2" data-page="page-rate-kpx">KPX 요율 관리</a>
              <a class="side-link sub2" data-page="page-rate-tou">시간대별 요금제 관리</a>
              <a class="side-link sub2" data-page="page-rate-market">SMP · REC 가격</a>
            </div>
          </div>
        </div>
      </div>
      <a class="side-link" data-page="page-admin-users"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 11.5l1.6 1.6 3-3.2"/></svg><span>권한관리</span></a>
    </nav>
  </aside>

<main class="content">
  <div class="page-head"><div class="page-crumb" id="pageCrumb"></div><h1 class="page-title" id="pageTitle"></h1><span id="pageRo" class="page-ro" hidden></span></div>

  <!-- 계약관리 > 계약이행현황 (추후) -->
  <div class="page" id="page-cust-perf"><div id="perfCustPage"></div></div>
  <div class="page" id="page-gen-perf"><div id="perfGenPage"></div></div>

  <!-- 정산관리 -->
  <div class="page" id="page-dash"></div>

  <!-- 계약관리 (js/registry.js) -->
  <div class="page" id="page-reg-cust"><div id="regCustPage"></div></div>
  <div class="page" id="page-reg-plant"><div id="regPlantPage"></div></div>
  <div class="page" id="page-reg-group"><div id="regGroupPage"></div></div>

  <!-- 정산 > 전기사용자 : 업로드 카드 + 가정산서/오차정산서 (js/billing.js) -->
  <div class="page" id="page-settle-cust">
    <div class="upload-slot"></div>
    <div id="tab5"></div>
  </div>

  <!-- 정산 > 발전사업자 : 업로드 카드 + 발전소별 확인/조정 + 정산서 -->
  <div class="page" id="page-settle-gen">
    <div class="upload-slot"></div>
    <div class="card" id="aggCard" style="display:none;">
      <h2>발전소별 집계</h2>
      <div class="grid-wrap">
        <table class="grid" id="aggTable"></table>
      </div>
    </div>
    <div class="card">
      <div class="row"><button class="btn accent" id="genCalcBtn" disabled>발전대금 계산</button><span id="genCalcStatus" class="status warn" style="background:none;"></span></div>
      <div id="genResult"></div>
      <div class="row" id="genPick" style="display:none; margin-top:12px;">
        <label style="font-size:12.5px; color:var(--sub);">발전사업자</label>
        <select id="plantSelectInvoice" class="plant-select" onchange="onPlantSelectChange(this.value)"></select>
      </div>
      <div class="action-grid">
        <button class="action-box" id="exportBtn" disabled>Excel 다운</button>
        <button class="action-box" id="pdfBtn" disabled>PDF 다운</button>
        <button class="action-box" id="exportAllBtn" disabled>전체 다운</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <span id="exportAllStatus" class="status warn" style="background:none;"></span>
      </div>
    </div>

    <div class="card doc-card" id="invoiceHost" style="display:none;"></div>
  </div>

  <!-- 정산요율관리 -->
  <div class="page" id="page-rate-kpx"><div id="tab4"></div></div>
  <div class="page" id="page-rate-tou"><div id="touPage"></div></div>
  <div class="page" id="page-rate-market"><div id="marketPage"></div></div>
  <div class="page" id="page-rec"><div id="recPage"></div></div>
  <div class="page" id="page-archive"><div id="archivePage"></div></div>
  <div class="page" id="page-admin-users"><div id="usersPage"></div></div>

  <!-- 업로드 카드: 하나만 두고 정산 페이지를 열 때 그 페이지의 .upload-slot 으로 옮긴다 (js/nav.js) -->
  <div id="uploadHolder" hidden>
    <div class="card" id="uploadCard">
      <div class="mode-section">
      <h2>정산 구분</h2>
      <div class="mode-boxes">
        <label class="mode-box"><input type="radio" name="settleMode" value="provisional" checked>
          <span class="mode-box-title">가정산</span></label>
        <label class="mode-box"><input type="radio" name="settleMode" value="trueup">
          <span class="mode-box-title">오차정산</span></label>
      </div>
      </div>

      <div class="upload-pair">
        <div class="upload-col">
          <h3 class="sub">① KPX 직접전력거래량 (.xlsx)</h3>
          <div class="drop-zone" id="dropZone">
            <div class="drop-zone-text">드래그해서 파일을 놓거나 클릭해서 선택하세요</div>
            <input type="file" id="dataFile" accept=".xlsx,.xls">
          </div>
          <div class="row upload-status">
            <span id="dataStatus" class="status warn" style="display:none;"></span>
            <span id="kpxStatus" class="status warn" style="display:none;"></span>
          </div>
        </div>
        <div class="upload-col">
          <h3 class="sub">② 전기사용량 15분 (.xls)</h3>
          <div class="drop-zone" id="amiDropZone">
            <div class="drop-zone-text">드래그해서 파일을 놓거나 클릭해서 선택하세요</div>
            <input type="file" id="amiFile" accept=".xls,.html,.htm">
          </div>
          <div class="row upload-status">
            <span id="amiStatus" class="status warn">미선택</span>
          </div>
        </div>
      </div>
      <div class="kpi-grid" id="siteKpis" style="display:none;"></div>
    </div>
  </div>
</main>
</div>

</div>

<script src="js/config.js?v=202610291339"></script>

<script src="js/upload.js?v=202610291339"></script>
<script src="js/invoice.js?v=202610291339"></script>
<script src="js/billing.js?v=202610291339"></script>
<script src="js/dashboard.js?v=202610291339"></script>
<script src="js/archive.js?v=202610291339"></script>
<script src="js/drive.js?v=202610291339"></script>
<script src="js/users.js?v=202610291339"></script>
<script src="js/rec.js?v=202610291339"></script>
<script src="js/tariff.js?v=202610291339"></script>
<script src="js/kpxrates.js?v=202610291339"></script>
<script src="js/market.js?v=202610291339"></script>
<script src="js/nav.js?v=202610291339"></script>
<script src="js/header.js?v=202610291339"></script>
<script src="js/exporters/excel.js?v=202610291339"></script>
<script src="js/exporters/pdf.js?v=202610291339"></script>
<script src="js/exporters/zip.js?v=202610291339"></script>
<script src="js/main.js?v=202610291339"></script>
</body>
</html>
